[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"          # verhindert Konflikte zwischen isort und Black
line_length = 88
src_paths = ["src"]

[tool.pylint.main]
source-roots = ["src"]
extension-pkg-allow-list = ["lxml"]

[tool.pylint.format]
max-line-length = 120       # gleiche Grenze wie Black

[tool.pylint."messages control"]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "W0511",  # fixme / TODO-Kommentare
    "C0103",   # Naming (UPPER_CASE-Konstanten, alte Modulnamen)
    "W0718",   # Broad exception (absichtliche catches in HTTP-Loops)
    "E0401",   # Import errors (lokale Imports funktionieren zur Laufzeit)
    "W0621",   # Redefining outer name (Funktionsparameter)
    "R0801",   # Duplicate code (verursachte auch den Unicode-Absturz auf Windows)
    "R1705",   # no-else-return
    "R0914",   # too-many-locals
    "R0912",   # too-many-branches
    "R0915",   # too-many-statements
]